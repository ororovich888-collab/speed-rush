function conn(){ws=new WebSocket(cur);
ws.onopen=()=>{for(const n in rooms){send({t:'join',room:n});if(Object.keys(rooms[n].my).length)send({t:'pres',room:n,patch:rooms[n].my})}};
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
ons.forEach(f=>{try{f(m)}catch(x){}});if(m.t=='hello')id=m.id;
else if(m.t=='peers'){const R=rooms[m.room];if(!R)return;R.peers=m.list.map(p=>({peer:p.id,isMe:p.id==id,sameTab:p.id==id,kind:'viewer',presence:p.pr||{}}));
